        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            background-image: url('../images2/trainnice.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #holder {
            width: 80%;
            max-width: 800px;
            border-radius: 10px;
            backdrop-filter: blur(15px);
            background-color: rgba(0, 0, 0, 0.7); /* Super dark and semi-transparent */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            margin: 100px auto 0;
            color: white; /* Adjust text color to contrast with dark background */
        }

        #holder h1 {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            color: #00bfae; /* Teal color for title */
            border-bottom: 2px solid #00bfae;
            padding-bottom: 10px;
        }

        .w3-card-4 {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1); /* Slightly transparent card background */
            color: white; /* Card text color */
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2); /* Subtle border */
            border-radius: 5px;
            transition: 0.3s;
        }

        .w3-card-4 img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 15px;
        }

        .w3-card-4:hover {
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .pagination span {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .pagination span.active {
            background-color: #00bfae;
        }

        .pagination span:hover {
            background-color: rgba(0, 191, 174, 0.8);
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.9); /* Dark popup background */
            color: white; /* White text for visibility */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            padding: 20px;
            z-index: 1000;
        }

        .popup h2 {
            margin-top: 0;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5); /* Subtle white border */
            padding-bottom: 10px;
        }

        .popup p {
            margin-bottom: 20px;
        }

        .popup .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            color: #333;
            font-weight: bold;
            transition: 0.3s;
        }

        .popup .close-btn:hover {
            color: #fff;
            background-color: #333;
            padding: 5px;
            border-radius: 50%;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* Navbar Hover Effect */
        .w3-bar a:hover {
            background-color: #00bfae;
            color: #fff;
        }

        /* Animation for fadeIn effect */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Interactive Button Effects */
        .w3-button {
            border-radius: 50px;
            transition: background-color 0.3s ease;
        }

        .w3-button:hover {
            background-color: #00bfae;
        }
		
		/* News Ticker Styling */
#news-ticker {
    position: relative;
    overflow: hidden;
    background-color: rgba(0, 0, 0, 0.8); /* Matches dark theme */
    color: #fff;
    padding: 10px 0;
    white-space: nowrap;
    font-size: 16px;
    border-top: 2px solid rgba(255, 255, 255, 0.3);
    border-bottom: 2px solid rgba(255, 255, 255, 0.3);
}

#ticker-content {
    display: inline-block;
    white-space: nowrap;
    animation: scroll-left 25s linear infinite;
}

@keyframes scroll-left {
    from {
        transform: translateX(100%);
    }
    to {
        transform: translateX(-100%);
    }
}

#ticker-content span {
    margin-right: 50px; /* Space between news items */
    font-weight: bold;
}

#ticker-content a {
    color: #00bfae;
    text-decoration: none;
}

#ticker-content a:hover {
    text-decoration: underline;
}
    </style>

<script>
// Dynamic News Ticker Items
const tickerData = [
    { title: "Free Tickets Until December 31, 2024!", link: "Ticketing.html" },
    { title: "Trains open from 5:30am to 12am EVERYDAY", link: "#" },
    { title: "Estimated Wait Times: 1-3minutes per Station", link: "#" },
    { title: "No Current Delays!", link: "" },
];

const tickerContent = document.getElementById("ticker-content");

// Dynamically add news items to the ticker
tickerData.forEach(item => {
    const newsElement = document.createElement("span");
    newsElement.innerHTML = `${item.title} <a href="${item.link}" target="_blank">Read more</a>`;
    tickerContent.appendChild(newsElement);
});
</script>

    <script>
    const newsData = [
        { title: "InstantRail is now running!", description: "The website is now live!", image: "../images2/newimage.png", link: "InstantRail HomePage.html" },
        { title: "InstantNews has been added!", description: "An informative bulletin board is now up and running!", image: "../images2/newimage.png", link: "InstantNews.html" },
        { title: "A Login has been added!", description: "A new login page is live!", image: "../images2/newimage.png", link: "login_screen.html" },
        { title: "Sign ups are up and running!", description: "A new sign up is live! Make an InstnatRail Account Now!", image: "../images2/newimage.png", link: "add_user_screen.html" },
        { title: "InstantTicketing has been added!", description: "The newly made ticketing system is up and running! Check it now!", image: "../images2/newimage.png", link: "Ticketing.html" },
        { title: "Tickets are now free!!!", description: "Train passes are free until December 31, 2024!", image: "../images2/newimage.png", link: "Ticketing.html" },
		{ title: "Coming Soon! InstnatTracking!", description: "InstnatTracking coming soon!", image: "../images2/newimage.png", link: "#" },
		{ title: "Language Selections now available!", description: "You can now change languages", image: "../images2/newimage.png", link: "#" },
		{ title: "View our available stations!", description: "Description 6", image: "../images2/newimage.png", link: "#" },
		{ title: "InstantTracking Coming Soon!", description: "Description 6", image: "../images2/newimage.png", link: "#" },
		{ title: "Contact Us is Coming Soon!", description: "Description 6", image: "../images2/newimage.png", link: "#" },
		{ title: "More updates Coming Soon!", description: "Description 6", image: "../images2/newimage.png", link: "#" }
    ];

    const itemsPerPage = 6;
    let currentPage = 1;

    function renderBulletin() {
        const container = document.getElementById("bulletin-container");
        container.innerHTML = "";

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = newsData.slice(start, end);

        pageData.forEach((item, index) => {
            const card = document.createElement("div");
            card.className = "w3-card-4";
            card.innerHTML = `
                <img src="${item.image}" alt="${item.title}">
                <h3>${item.title}</h3>
            `;
            // Debugging: Ensure the `onclick` is working
            card.onclick = () => {
                console.log(`Clicked on card: ${item.title}`);
                showDetails(start + index);
            };
            container.appendChild(card);
        });

        renderPagination();
    }

    function renderPagination() {
        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        const totalPages = Math.ceil(newsData.length / itemsPerPage);
        for (let i = 1; i <= totalPages; i++) {
            const page = document.createElement("span");
            page.className = i === currentPage ? "active" : "";
            page.onclick = () => {
                console.log(`Navigated to page: ${i}`);
                currentPage = i;
                renderBulletin();
            };
            pagination.appendChild(page);
        }
    }

    function showDetails(index) {
        const overlay = document.getElementById("overlay");
        const popup = document.getElementById("popup");
        const item = newsData[index];

        console.log(`Popup data: ${JSON.stringify(item)}`);

        // Update popup content
        document.getElementById("popup-title").innerText = item.title;
        document.getElementById("popup-description").innerHTML = `${item.description} <a href="${item.link}" target="_blank">Learn more</a>`;

        // Display popup and overlay
        overlay.style.display = "block";
        popup.style.display = "block";
    }

    function hideDetails() {
        console.log("Hiding popup");
        document.getElementById("overlay").style.display = "none";
        document.getElementById("popup").style.display = "none";
    }

    // Initialize the bulletin board
    renderBulletin();
</script>
